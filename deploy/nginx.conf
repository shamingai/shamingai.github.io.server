# Nginx 反代：https://api.zhaotong.fun -> 127.0.0.1:8787
# 安装：sudo cp deploy/nginx.conf /etc/nginx/sites-available/api.zhaotong.fun
#       sudo ln -s /etc/nginx/sites-available/api.zhaotong.fun /etc/nginx/sites-enabled/
#       sudo certbot --nginx -d api.zhaotong.fun
#       sudo nginx -t && sudo systemctl reload nginx
# 证书由 certbot 自动补写 ssl 相关指令；没有证书前先用 80 端口验证，再执行 certbot。
#
# 后端 .env：HOST=127.0.0.1（只监听本机，由 Nginx 对外）、PORT=8787、
#            CORS_ORIGINS=https://blog.zhaotong.fun（默认值，不配也行）

server {
    listen 80;
    listen [::]:80;
    server_name api.zhaotong.fun;

    # 只暴露 API；管理接口仍由后端校验 Bearer 令牌
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 跨域响应头由后端（@fastify/cors）生成，Nginx 不要重复添加
        proxy_hide_header X-Powered-By;

        # 生成接口会同步调用 LLM、采集和链接检查，可能超过默认 60s
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        client_max_body_size 256k;
    }

    location = /health {
        return 404;
    }

    # 健康检查走 /api/health（由 location /api/ 转给后端）
    location / {
        return 404;
    }
}
